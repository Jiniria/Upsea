<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#06121c">
<title>Aquarium</title>
<style>
*{box-sizing:border-box}.fishAnimation{position:fixed;left:-10000px;top:0;pointer-events:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06121c}body{background-image:url('./bg_upsea_01.png');background-position:center;background-size:cover;background-repeat:no-repeat}#feed,#tank{position:fixed;inset:0;width:100%;height:100%}#feed{object-fit:cover;transform:scaleX(-1);display:none}#tank{pointer-events:none}#camera{position:fixed;right:18px;top:18px;width:64px;height:64px;border:0;border-radius:0;background:transparent;color:inherit;display:block;cursor:pointer;z-index:2;padding:0;appearance:none}#camera:hover,#camera[aria-pressed="true"]{background:transparent;border:0}#camera .camera-icon{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;transition:opacity .12s ease;pointer-events:none}#camera .camera-icon-hover{opacity:0}#camera:hover .camera-icon-default{opacity:0}#camera:hover .camera-icon-hover{opacity:1}
</style></head>
<body>
<video id="feed" autoplay muted playsinline></video><canvas id="tank"></canvas><div id="fishAnimations" aria-hidden="true"></div>
<button id="camera" aria-label="Turn camera on" aria-pressed="false"><img class="camera-icon camera-icon-default" src="./cameraicon_default.svg" alt="" aria-hidden="true"><img class="camera-icon camera-icon-hover" src="./cameraicon_hover.svg" alt="" aria-hidden="true"></button>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
(()=>{
const canvas=document.querySelector('#tank'),ctx=canvas.getContext('2d',{alpha:true}),video=document.querySelector('#feed'),button=document.querySelector('#camera');
const W=()=>innerWidth,H=()=>innerHeight, fishCanvases=[[],[]],fishRatios=[[85/83,85/83],[174/174,174/174]],assetFiles=[['nemo_mini.lottie','nemo_halloween.lottie'],['blue-fish.lottie','blue-fish_halloween.lottie']];
async function loadFishAnimation(kind,variant){const file=assetFiles[kind][variant],host=document.createElement('div');host.className='fishAnimation';host.style.width=(kind===0?85:174)+'px';host.style.height=(kind===0?83:174)+'px';document.querySelector('#fishAnimations').appendChild(host);try{const response=await fetch(file);if(!response.ok)throw new Error('Unable to load '+file);const zip=await JSZip.loadAsync(await response.arrayBuffer()),data=JSON.parse(await zip.file('animations/animation.json').async('string'));for(const asset of data.assets||[]){if(!asset.p)continue;const imageFile=zip.file('images/'+asset.p);if(!imageFile)continue;asset.p='data:image/png;base64,'+await imageFile.async('base64');asset.u='';asset.e=1}fishRatios[kind][variant]=data.w/data.h;const animation=lottie.loadAnimation({container:host,renderer:'canvas',loop:true,autoplay:true,animationData:data,rendererSettings:{preserveAspectRatio:'xMidYMid meet'}});animation.addEventListener('DOMLoaded',()=>{fishCanvases[kind][variant]=host.querySelector('canvas')})}catch(error){console.error('Fish Lottie failed to load:',error)}}
for(let kind=0;kind<2;kind++)for(let variant=0;variant<2;variant++)loadFishAnimation(kind,variant);
let halloweenMode=false,dpr=1, fishes=[],stream=null,hands=null,processing=false,lastDetect=0,lastFrame=performance.now(),handPoints=[],pinchStart=0,pinchCharged=false;
let requestedFormation='normal',activeFormation='normal',gestureCandidate='normal',gestureSince=0,formationBases=[40,40];
const FORMATION_DURATION=1000;
function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W()*dpr);canvas.height=Math.round(H()*dpr);canvas.style.width=W()+'px';canvas.style.height=H()+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}
function fishAsset(f){return fishCanvases[f.kind][halloweenMode?1:0]}
function fishRatio(f){return fishRatios[f.kind][halloweenMode?1:0]}
function fishHeight(f){return f.size/fishRatio(f)}
function makeFish(kind,bornAt=performance.now()){
 let speed=rand(20,80),size=kind===0?rand(20,90):rand(20,140),h=size/(kind===0?85/83:174/174);
 return{x:-size/2-rand(0,Math.max(120,W()*.18)),y:rand(h/2,Math.max(h/2,H()-h/2)),vx:speed,vy:0,speed,size,kind,phase:rand(0,Math.PI*2),bornAt,respawnAt:0,formation:null};
}
function initFish(){for(let i=0;i<44;i++){let f=makeFish(i%2);f.x-=i*rand(8,24);fishes.push(f)}}initFish();
function drawFish(f){let img=fishAsset(f);if(!img)return;let w=f.size,h=w/fishRatio(f);ctx.save();ctx.translate(f.x,f.y);ctx.scale(-1,1);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore()}
function normalSwim(f,now,dt){let h=fishHeight(f),drift=Math.sin(now*.0008+f.phase)*f.speed*.17;let tx=f.speed,ty=drift;
 if(handPoints.length){const target=handPoints[0],radius=handPoints.length>1?Math.max(50,Math.min(320,Math.hypot(handPoints[0].x-handPoints[1].x,handPoints[0].y-handPoints[1].y)*.55)):150;let dx=target.x-f.x,dy=target.y-f.y,d=Math.hypot(dx,dy);if(d<radius&&d>1){let strength=1-d/radius;tx+=dx/d*f.speed*1.8*strength;ty+=dy/d*f.speed*1.8*strength}}
 let smooth=1-Math.exp(-2.5*dt);f.vx+=(tx-f.vx)*smooth;f.vy+=(ty-f.vy)*smooth;let mag=Math.hypot(f.vx,f.vy),max=f.speed*2;if(mag>max){f.vx=f.vx/mag*max;f.vy=f.vy/mag*max}f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.y<h/2)f.vy+=f.speed*.35*dt;if(f.y>H()-h/2)f.vy-=f.speed*.35*dt;
}
function formationTargets(mode){let groups=mode==='two'?[[...fishes.filter(f=>f.kind===0)],[...fishes.filter(f=>f.kind===1)]]:[[],[]];if(mode==='fists'){const ordered=[...fishes].sort((a,b)=>a.x-b.x);ordered.forEach((f,i)=>groups[Math.floor(i/2)%2].push(f));}
 let targets=new Map();for(let row=0;row<2;row++){let arr=groups[row];arr.sort((a,b)=>a.x-b.x);let total=arr.reduce((sum,f)=>sum+f.size,0)+Math.max(0,arr.length-1)*16,start=Math.max(40,(W()-total)/2),x=start;for(let i=0;i<arr.length;i++){if(i)x+=arr[i-1].size/2+16+arr[i].size/2;targets.set(arr[i],{x,y:row===0?H()*.34:H()*.68,row,slot:i,count:arr.length,offset:x})}}return targets}
function setFormation(mode,now){if(mode===activeFormation)return;activeFormation=mode;formationBases=[0,0];const targets=mode==='normal'?new Map(fishes.map(f=>[f,{x:Math.min(W()-f.size/2,f.x+f.vx*.35),y:f.y}])):formationTargets(mode);for(const f of fishes){const target=targets.get(f);f.formation=target?{fromX:f.x,fromY:f.y,fromVx:f.vx,fromVy:f.vy,toX:target.x,toY:target.y,toVx:mode==='normal'?f.speed:55,toVy:0,start:now,duration:FORMATION_DURATION,...target,settled:false}:null}}
function countFingers(lm){let n=0;for(const [tip,pip] of [[8,6],[12,10],[16,14],[20,18]])if(lm[tip].y<lm[pip].y)n++;if(Math.hypot(lm[4].x-lm[17].x,lm[4].y-lm[17].y)>Math.hypot(lm[3].x-lm[17].x,lm[3].y-lm[17].y)*1.12)n++;return n}
function classifyHands(sets){if(!sets||sets.length!==2)return'absent';const counts=sets.slice(0,2).map(countFingers);if(counts.every(n=>n===1))return'halloween';if(counts.every(n=>n===3))return'default';if(counts.every(n=>n===5))return'exit';if(counts.every(n=>n===0))return'fists';if(counts.every(n=>n===2))return'two';return'hold'}
function onResults(res){handPoints=[];let now=performance.now(),sets=res.multiHandLandmarks||[],pinched=false;for(const lm of sets.slice(0,2)){const p=lm[8];handPoints.push({x:(1-p.x)*W(),y:p.y*H()});if(Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y)<.055)pinched=true}
 const detected=classifyHands(sets);if(detected==='halloween')halloweenMode=true;else if(detected==='default')halloweenMode=false;if(detected==='absent'||detected==='exit'){requestedFormation='normal';gestureCandidate=detected;gestureSince=now}else if(detected==='fists'||detected==='two'){if(detected!==gestureCandidate){gestureCandidate=detected;gestureSince=now}else if(now-gestureSince>=150)requestedFormation=detected}
 if(pinched){if(!pinchStart)pinchStart=now;if(now-pinchStart>=1000)pinchCharged=true}else{if(pinchCharged&&handPoints.length){for(const f of fishes){let t=handPoints[0],dx=f.x-t.x,dy=f.y-t.y,d=Math.hypot(dx,dy);if(d<240){let k=(1-d/240)*f.speed*3.2;f.vx+=dx/(d||1)*k;f.vy+=dy/(d||1)*k}}}pinchStart=0;pinchCharged=false}}
function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-lastFrame)/1000,.04);lastFrame=now;ctx.clearRect(0,0,W(),H());if(requestedFormation!==activeFormation)setFormation(requestedFormation,now);const transitioning=fishes.some(f=>f.formation&&!f.formation.settled);if(activeFormation!=='normal'&&!transitioning){for(let row=0;row<2;row++){const rowFish=fishes.filter(f=>f.formation&&f.formation.row===row),minOffset=rowFish.length?Math.min(...rowFish.map(f=>f.formation.offset)):0,maxOffset=rowFish.length?Math.max(...rowFish.map(f=>f.formation.offset)):0,maxSize=rowFish.length?Math.max(...rowFish.map(f=>f.size)):0;formationBases[row]+=55*dt;if(formationBases[row]+minOffset>W()+maxSize)formationBases[row]=-maxOffset-maxSize-20}}
 for(let i=0;i<fishes.length;i++){let f=fishes[i];if(f.respawnAt){if(now>=f.respawnAt){fishes[i]=f=makeFish(f.kind,now);if(activeFormation!=='normal')setFormation(activeFormation,now)}else continue}if(activeFormation==='normal'&&!f.formation&&f.x>W()+f.size/2){f.respawnAt=now+rand(500,2000);continue}
 if(f.formation&&!f.formation.settled){let q=f.formation,t=Math.min(1,(now-q.start)/q.duration),t2=t*t,t3=t2*t,h00=2*t3-3*t2+1,h10=t3-2*t2+t,h01=-2*t3+3*t2,h11=t3-t2,dh00=6*t2-6*t,dh10=3*t2-4*t+1,dh01=-6*t2+6*t,dh11=3*t2-2*t;f.x=h00*q.fromX+h10*(q.duration/1000)*q.fromVx+h01*q.toX+h11*(q.duration/1000)*q.toVx;f.y=h00*q.fromY+h10*(q.duration/1000)*q.fromVy+h01*q.toY+h11*(q.duration/1000)*q.toVy;f.vx=(dh00*q.fromX+dh10*(q.duration/1000)*q.fromVx+dh01*q.toX+dh11*(q.duration/1000)*q.toVx)/(q.duration/1000);f.vy=(dh00*q.fromY+dh10*(q.duration/1000)*q.fromVy+dh01*q.toY+dh11*(q.duration/1000)*q.toVy)/(q.duration/1000);if(t>=1){if(activeFormation==='normal')f.formation=null;else f.formation.settled=true}}
 else if(activeFormation==='normal')normalSwim(f,now,dt);else if(f.formation){f.x=formationBases[f.formation.row]+f.formation.offset;f.y=f.formation.row===0?H()*.34:H()*.68;f.vx=55;f.vy=0}
 drawFish(f)} }
requestAnimationFrame(animate);
async function cameraOn(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();video.style.display='block';button.setAttribute('aria-pressed','true');button.setAttribute('aria-label','Turn camera off');hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.55,minTrackingConfidence:.5});hands.onResults(onResults);processing=true;detectLoop()}catch(e){cameraOff()}}
async function detectLoop(){if(!processing)return;let now=performance.now();if(video.readyState>=2&&now-lastDetect>65){lastDetect=now;try{await hands.send({image:video})}catch(e){}}if(processing)requestAnimationFrame(detectLoop)}
function cameraOff(){processing=false;handPoints=[];halloweenMode=false;requestedFormation='normal';gestureCandidate='absent';gestureSince=0;pinchStart=0;pinchCharged=false;if(hands){hands.close().catch(()=>{});hands=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.pause();video.srcObject=null;video.style.display='none';button.setAttribute('aria-pressed','false');button.setAttribute('aria-label','Turn camera on')}
button.addEventListener('click',()=>stream?cameraOff():cameraOn());addEventListener('pagehide',cameraOff);
})();
</script></body></html>
